<html lang="zh-CN">

<body>

<div class="container">

  <div class="topbar">

  <article class="article">
    <h1>作品标题</h1>
    <p class="subtitle">个人独立 · 2026.10 · 一句话身份说明</p>

    <h2>一、第一节标题</h2>
    <p>正文段落。</p>

    <h3>1.1 小节标题</h3>
    <ul>
      <li><b>要点：</b>说明</li>
      <li><b>要点：</b>说明</li>
    </ul>

    <!-- 引用块：用来放结论、核心洞察 -->
    <blockquote>
      <p><b>核心结论：</b>……</p>
    </blockquote>

    <!-- 表格：对比、参数、系统清单都用它 -->
    <table>
      <tr><th>列一</th><th>列二</th><th>列三</th></tr>
      <tr><td>内容</td><td>内容</td><td>内容</td></tr>
    </table>

    <!-- 插图：图片放 diagrams/ 或 thumbs/ 目录 -->
    <img src="diagrams/图.svg" alt="图的描述（给读屏软件和无图时看）">
    <p class="fig-cap">图注写在图下面</p>

    <!-- 竖版长图（高比宽大）加 class="narrow" 限宽，否则会占满整屏 -->

      <a href="其他作品.html" class="btn">📄 延伸阅读：某某 →</a>
